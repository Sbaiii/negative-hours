[project]
name = "negative-hours"
version = "0.1.0"
description = "Negative-price hours, solar capture prices and battery value in the European day-ahead electricity market."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "entsoe-py>=0.8.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
# Local modules: the pipeline and battery packages and the notebooks' shared chart style.
known-first-party = ["pipeline", "battery", "chart_style"]
