models:
  - name: int_prices_local
    description: >
      stg_prices plus each zone's local time (from seed `zones`) and the period
      length in hours. Same grain as stg_prices: one row per zone and period.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, ts_utc]
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: ts_utc
        description: Start of the period, UTC (key).
        data_tests: [not_null]
      - name: ts_local
        description: Start of the period on the zone's local wall clock (no time zone). Repeats for one hour at the autumn DST change.
      - name: local_date
        description: Local calendar date of the period start.
      - name: local_year
        description: Local calendar year of the period start. Years in the marts are local years (ADR-005).
        data_tests: [not_null]
      - name: timezone
        description: IANA time zone used for the zone.
      - name: price_eur_mwh
        description: Day-ahead price, EUR/MWh.
      - name: resolution_minutes
        description: Length of the period in minutes.
      - name: duration_h
        description: Length of the period in hours (resolution_minutes / 60). Sum this, not rows, to measure time.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0.25, 1.0]

  - name: int_zone_years
    description: >
      One row per zone and local calendar year with prices: the year's start and end
      (local midnight, as UTC instants), expected hours (current year: up to the end
      of the last price period) and any known reason the year is partial. Shared by
      fct_negative_hours and fct_capture_prices so they agree on partial years.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year]
    columns:
      - name: zone
        data_tests: [not_null]
      - name: local_year
        data_tests: [not_null]
      - name: expected_hours
        description: Hours in the local year (8760/8784), or up to the end of the last price period for the current year.
        data_tests: [not_null]
      - name: known_partial_reason
        description: "'current_year', 'pln_prices_excluded' or null."
        data_tests:
          - accepted_values:
              arguments:
                values: ['current_year', 'pln_prices_excluded']

  - name: int_energy_hourly
    description: >
      Prices and generation per zone on a common hourly grid (ADR-006): the hourly
      price is the duration-weighted mean of the periods in the hour, generation is
      energy (MWh = MW x duration_h) summed within the hour. Only hours with both a
      price and some generation are kept.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, hour_utc]
    columns:
      - name: zone
        data_tests: [not_null]
      - name: hour_utc
        description: Start of the hour, UTC.
        data_tests: [not_null]
      - name: hour_local
        description: Start of the hour on the zone's local wall clock (repeats at the autumn DST change).
      - name: local_date
        description: Local calendar date.
      - name: local_year
        description: Local calendar year (ADR-005).
        data_tests: [not_null]
      - name: price_eur_mwh
        description: Duration-weighted mean day-ahead price in the hour, EUR/MWh.
        data_tests: [not_null]
      - name: price_hours_covered
        description: Fraction of the hour with a price (1.0 = complete).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.25
                max_value: 1.0
      - name: generation_hours_covered
        description: Fraction of the hour with generation periods (1.0 = complete).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.25
                max_value: 1.0
      - name: solar_mwh
        description: Solar energy in the hour as reported to ENTSO-E (MWh); null if no Solar row.
      - name: wind_mwh
        description: Wind onshore + offshore energy in the hour (MWh); null if no wind row.
      - name: total_generation_mwh
        description: Energy of all reported production types in the hour (MWh).
        data_tests: [not_null]
