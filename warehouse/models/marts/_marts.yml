models:
  - name: fct_negative_hours
    description: >
      Q1 — how often day-ahead prices are negative. One row per zone and local
      calendar year. All "hours" are summed period durations, so 15-min and 60-min
      periods count correctly (ADR-005).
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year]
      - expression_is_true:
          arguments:
            expression: "negative_hours <= zero_or_negative_hours and zero_or_negative_hours <= covered_hours"
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: local_year
        description: Calendar year in the zone's local time.
        data_tests: [not_null]
      - name: negative_hours
        description: Hours with a day-ahead price strictly below 0 EUR/MWh.
        data_tests: [not_null]
      - name: zero_or_negative_hours
        description: Hours with a price at or below 0 EUR/MWh (includes exactly-zero prices, common in Iberia).
        data_tests: [not_null]
      - name: covered_hours
        description: Hours with a price in the data.
      - name: expected_hours
        description: Hours in the local year (8760/8784), or up to the end of the last period for the current year.
      - name: completeness
        description: covered_hours / expected_hours.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.98
                max_value: 1.0
              config:
                severity: warn
                where: "not is_partial_year"
      - name: min_price
        description: Lowest price in the year, EUR/MWh.
      - name: avg_price
        description: Duration-weighted average price, EUR/MWh.
      - name: avg_price_negative_periods
        description: Duration-weighted average price over negative-price periods only, EUR/MWh. Null if none.
      - name: is_partial_year
        description: >
          True when the year is not a full year of data: the current year, or
          completeness below 0.98. Compare zones on full years only (ADR-005).
        data_tests: [not_null]
      - name: partial_reason
        description: >
          Why the year is partial: 'current_year' (year to date) or
          'pln_prices_excluded' (PL before 2019-11-20: prices in PLN, left out).
          Null for full years.
        data_tests:
          - accepted_values:
              arguments:
                values: ['current_year', 'pln_prices_excluded']

  - name: fct_capture_prices
    description: >
      Q2 — solar and wind capture prices. One row per zone and local calendar year,
      from the hourly grid in int_energy_hourly (ADR-006). Capture price =
      sum(price x MWh) / sum(MWh); capture rate = capture price / baseload price.
      Generation is **as reported to ENTSO-E**: solar may miss rooftop PV in some
      zones, which affects solar_share more than the capture rate (see Data Dictionary).
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year]
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: local_year
        description: Calendar year in the zone's local time.
        data_tests: [not_null]
      - name: baseload_price
        description: Time-weighted mean day-ahead price over the matched hours, EUR/MWh.
        data_tests: [not_null]
      - name: solar_mwh
        description: Solar energy in the year as reported to ENTSO-E, MWh. Null if solar_coverage < 0.95.
      - name: solar_capture_price
        description: Solar-weighted average price, EUR/MWh.
      - name: solar_capture_rate
        description: solar_capture_price / baseload_price. Below 1 = solar earns less than the average hour.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: solar_share
        description: solar_mwh / total_generation_mwh, as reported to ENTSO-E (not national consumption).
      - name: wind_mwh
        description: Wind onshore + offshore energy, MWh. Null if wind_coverage < 0.95.
      - name: wind_capture_price
        description: Wind-weighted average price, EUR/MWh.
      - name: wind_capture_rate
        description: wind_capture_price / baseload_price.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: wind_share
        description: wind_mwh / total_generation_mwh, as reported to ENTSO-E.
      - name: total_generation_mwh
        description: Energy of all reported production types in the matched hours, MWh.
      - name: matched_hours
        description: Hours with both a price and generation.
      - name: expected_hours
        description: Hours in the local year (current year up to the end of the last price period), from int_zone_years.
      - name: coverage
        description: matched_hours / expected_hours.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.95
                max_value: 1.0
              config:
                severity: warn
                where: "not is_partial_year"
      - name: solar_coverage
        description: Share of matched hours with a Solar row. Solar metrics are null below 0.95.
      - name: wind_coverage
        description: Share of matched hours with a wind row. Wind metrics are null below 0.95.
      - name: is_partial_year
        description: Current year, a known partial reason, or coverage < 0.98 (same rule as fct_negative_hours).
        data_tests: [not_null]
      - name: partial_reason
        description: "'current_year' / 'pln_prices_excluded' / null."
