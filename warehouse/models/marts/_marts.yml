models:
  - name: fct_negative_hours
    description: >
      Q1 — how often day-ahead prices are negative. One row per zone and local
      calendar year. All "hours" are summed period durations, so 15-min and 60-min
      periods count correctly (ADR-005).
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year]
      - expression_is_true:
          arguments:
            expression: "negative_hours <= zero_or_negative_hours and zero_or_negative_hours <= covered_hours"
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: local_year
        description: Calendar year in the zone's local time.
        data_tests: [not_null]
      - name: negative_hours
        description: Hours with a day-ahead price strictly below 0 EUR/MWh.
        data_tests: [not_null]
      - name: zero_or_negative_hours
        description: Hours with a price at or below 0 EUR/MWh (includes exactly-zero prices, common in Iberia).
        data_tests: [not_null]
      - name: covered_hours
        description: Hours with a price in the data.
      - name: expected_hours
        description: Hours in the local year (8760/8784), or up to the end of the last period for the current year.
      - name: completeness
        description: covered_hours / expected_hours.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.98
                max_value: 1.0
              config:
                severity: warn
                where: "not is_partial_year"
      - name: min_price
        description: Lowest price in the year, EUR/MWh.
      - name: avg_price
        description: Duration-weighted average price, EUR/MWh.
      - name: avg_price_negative_periods
        description: Duration-weighted average price over negative-price periods only, EUR/MWh. Null if none.
      - name: is_partial_year
        description: >
          True when the year is not a full year of data: the current year, or
          completeness below 0.98. Compare zones on full years only (ADR-005).
        data_tests: [not_null]
      - name: partial_reason
        description: >
          Why the year is partial: 'current_year' (year to date) or
          'pln_prices_excluded' (PL before 2019-11-20: prices in PLN, left out).
          Null for full years.
        data_tests:
          - accepted_values:
              arguments:
                values: ['current_year', 'pln_prices_excluded']

  - name: fct_capture_prices
    description: >
      Q2 — solar and wind capture prices. One row per zone and local calendar year,
      from the hourly grid in int_energy_hourly (ADR-006). Capture price =
      sum(price x MWh) / sum(MWh); capture rate = capture price / baseload price.
      Generation is **as reported to ENTSO-E**: solar may miss rooftop PV in some
      zones, which affects solar_share more than the capture rate (see Data Dictionary).
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year]
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: local_year
        description: Calendar year in the zone's local time.
        data_tests: [not_null]
      - name: baseload_price
        description: Time-weighted mean day-ahead price over ALL price periods of the zone-year, EUR/MWh (= fct_negative_hours.avg_price, tested).
        data_tests: [not_null]
      - name: solar_mwh
        description: Solar energy in the year as reported to ENTSO-E, MWh. Null if solar_coverage < 0.95.
      - name: solar_capture_price
        description: Solar-weighted average price, EUR/MWh.
      - name: solar_capture_rate
        description: solar_capture_price / baseload_price. Below 1 = solar earns less than the average hour.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: solar_share
        description: solar_mwh / total_generation_mwh, as reported to ENTSO-E (not national consumption).
      - name: wind_mwh
        description: Wind onshore + offshore energy, MWh. Null if wind_coverage < 0.95.
      - name: wind_capture_price
        description: Wind-weighted average price, EUR/MWh.
      - name: wind_capture_rate
        description: wind_capture_price / baseload_price.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: wind_share
        description: wind_mwh / total_generation_mwh, as reported to ENTSO-E.
      - name: total_generation_mwh
        description: Energy of all reported production types in the matched hours, MWh.
      - name: matched_hours
        description: Hours with both a price and generation.
      - name: expected_hours
        description: Hours in the local year (current year up to the end of the last price period), from int_zone_years.
      - name: coverage
        description: matched_hours / expected_hours.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.95
                max_value: 1.0
              config:
                severity: warn
                where: "not is_partial_year"
      - name: solar_coverage
        description: Share of matched hours with a Solar row. Solar metrics are null below 0.95.
      - name: wind_coverage
        description: Share of matched hours with a wind row. Wind metrics are null below 0.95.
      - name: is_partial_year
        description: Current year, a known partial reason, or coverage < 0.98 (same rule as fct_negative_hours).
        data_tests: [not_null]
      - name: partial_reason
        description: "'current_year' / 'pln_prices_excluded' / null."

  - name: fct_solar_monthly
    description: >
      Solar capture price per zone and local calendar month (same definitions as
      fct_capture_prices, ADR-006). Built to test where an annual capture rate comes
      from: how expensive months line up with sunny months.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_month]
    columns:
      - name: zone
        data_tests: [not_null]
      - name: local_month
        description: First day of the local calendar month.
        data_tests: [not_null]
      - name: baseload_price
        description: Time-weighted mean price over all price periods of the month, EUR/MWh.
        data_tests: [not_null]
      - name: solar_mwh
        description: Solar energy in the month, as reported to ENTSO-E, MWh (matched hours).
      - name: solar_capture_price
        description: Solar-weighted average price in the month, EUR/MWh.
      - name: solar_capture_rate
        description: Monthly solar capture price / monthly baseload.
      - name: solar_coverage
        description: Share of the month's matched hours with a Solar row.

  - name: fct_battery_arbitrage
    description: >
      Q3 — day-ahead arbitrage value of a 1 MW battery. One row per zone, local
      calendar year and battery duration (1, 2, 4 h), summed from the daily LP
      results (source battery.arbitrage_daily, ADR-007). Perfect foresight on
      cleared day-ahead prices, at most one cycle a day: an upper bound for the
      day-ahead market alone. Excludes intraday, balancing and capacity markets,
      degradation and grid fees. Not a business case.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year, battery_duration_h]
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
      - expression_is_true:
          arguments:
            expression: "revenue_eur_per_mw >= heuristic_revenue_eur_per_mw and cycles <= days_solved"
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: local_year
        description: Calendar year in the zone's local time.
        data_tests: [not_null]
      - name: battery_duration_h
        description: Energy capacity / power, hours (1 MW battery, so 2 h = 2 MWh).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 4]
                quote: false
      - name: revenue_eur_per_mw
        description: Sum of daily optimal revenue in the year, EUR per MW (year to date for the current year).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: avg_daily_revenue_eur_per_mw
        description: revenue_eur_per_mw / days_solved.
      - name: avg_spread_captured_eur_mwh
        description: Energy-weighted average sell price minus average buy price, EUR/MWh (before losses).
      - name: avg_sell_price
        description: Average price of the energy sold, EUR/MWh.
      - name: avg_buy_price
        description: Average price of the energy bought, EUR/MWh (can be below 0).
      - name: cycles
        description: Full equivalent cycles in the year (energy drawn from storage / capacity). At most 1 per day.
      - name: avg_daily_cycles
        description: cycles / days_solved.
      - name: charged_negative_mwh
        description: Energy bought at negative prices, MWh per MW.
      - name: negative_charging_revenue_eur
        description: Money received for charging at negative prices, EUR per MW.
      - name: negative_revenue_share
        description: negative_charging_revenue_eur / revenue_eur_per_mw.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: heuristic_revenue_eur_per_mw
        description: Revenue of the rule of thumb (charge in the cheapest N hours, discharge in the dearest N), EUR per MW.
      - name: lp_uplift
        description: revenue_eur_per_mw / heuristic_revenue_eur_per_mw - 1. What optimisation adds over the rule of thumb.
      - name: days_solved
        description: Complete local days with prices (incomplete days are skipped).
      - name: expected_hours
        description: Hours in the local year (current year up to the end of the last price period), from int_zone_years.
      - name: coverage
        description: Hours of the solved days / expected_hours.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.98
                max_value: 1.0
              config:
                severity: warn
                where: "not is_partial_year"
      - name: is_partial_year
        description: Current year, a known partial reason, or coverage < 0.98 (same rule as the other marts).
        data_tests: [not_null]
      - name: partial_reason
        description: "'current_year' / 'pln_prices_excluded' / null."

  - name: fct_hourly_profile
    description: >
      Q4 — the daily price shape. One row per zone, local year, season and local
      hour of day (0 to 23). Seasons are meteorological and stay inside the local
      calendar year: winter = Jan, Feb, Dec (ADR-008). Mean and share are
      duration-weighted over native periods; the median is over hourly values.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, local_year, season, local_hour]
      - expression_is_true:
          arguments:
            expression: "is_partial_year = (partial_reason is not null)"
    columns:
      - name: zone
        data_tests: [not_null]
      - name: local_year
        data_tests: [not_null]
      - name: season
        description: winter (Jan, Feb, Dec), spring (Mar to May), summer (Jun to Aug), autumn (Sep to Nov).
        data_tests:
          - accepted_values:
              arguments:
                values: ['winter', 'spring', 'summer', 'autumn']
      - name: local_hour
        description: Hour of day on the zone's local clock (0 = 00:00 to 01:00).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: mean_price
        description: Duration-weighted mean day-ahead price, EUR/MWh.
        data_tests: [not_null]
      - name: median_price
        description: Median of the hourly prices (one per day; 15-min periods averaged to the hour first), EUR/MWh.
        data_tests: [not_null]
      - name: share_at_or_below_zero
        description: Share of the time (duration-weighted) with a price at or below 0.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: covered_hours
        description: Hours with a price in this cell; weight for combining seasons into a year.
      - name: is_partial_year
        description: Same rule as fct_negative_hours (current year, a known reason, or completeness < 0.98).
        data_tests: [not_null]
      - name: partial_reason
        description: "'current_year' / 'pln_prices_excluded' / null."

