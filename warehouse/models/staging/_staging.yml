models:
  - name: stg_prices
    description: >
      Day-ahead prices, one row per zone and period. Renamed/typed only.
      Periods are 60 min until the SDAC switch to 15-min products (2025-09-30 22:00 UTC),
      15 min after.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, ts_utc]
    columns:
      - name: zone
        description: Bidding zone code (see seed `zones`).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('zones')
                field: zone
      - name: ts_utc
        description: Start of the period, UTC.
        data_tests: [not_null]
      - name: price_eur_mwh
        description: Day-ahead clearing price, EUR/MWh. Within the SDAC harmonised limits.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -500
                max_value: 4000
      - name: resolution_minutes
        description: Length of the period in minutes (ADR-004).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [15, 60]

  - name: stg_load
    description: Actual total load, one row per zone and period. Renamed/typed only. PT is hourly throughout.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, ts_utc]
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: ts_utc
        description: Start of the period, UTC.
        data_tests: [not_null]
      - name: load_mw
        description: Average load over the period, MW.
        data_tests: [not_null]
      - name: resolution_minutes
        description: Length of the period in minutes (ADR-004).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [15, 60]

  - name: stg_generation
    description: >
      Actual generation per production type, long format, renamed/typed.
      Production types that have never been non-zero in a zone are dropped. As of
      2026-10-03 that removes: BE Fossil Hard coal; ES Fossil Coal-derived gas,
      Fossil Oil shale, Fossil Peat, Geothermal, Marine, Wind Offshore; IT_NORD
      Geothermal; NL Hydro Run-of-river and pondage; PL Energy storage (new in
      2026-09, all zero so far). The filter is computed from the data, so the list
      updates itself.
    data_tests:
      - unique_combination:
          arguments:
            columns: [zone, production_type, ts_utc]
    columns:
      - name: zone
        description: Bidding zone code.
        data_tests: [not_null]
      - name: production_type
        description: ENTSO-E production type as named by entsoe-py (e.g. Solar, Wind Onshore).
        data_tests: [not_null]
      - name: ts_utc
        description: Start of the period, UTC.
        data_tests: [not_null]
      - name: generation_mw
        description: Average power fed into the grid over the period, MW. Generation only; pumped-storage consumption is not included.
        data_tests: [not_null]
      - name: resolution_minutes
        description: Length of the period in minutes (ADR-004).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [15, 60]
